services:
  db:
    image: mariadb:11.4
    container_name: nextcloud-db

    restart: unless-stopped

    user: "999:999"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID

    command:
      - --transaction-isolation=READ-COMMITTED
      - --binlog-format=ROW
      - --skip-name-resolve
      - --bind-address=0.0.0.0

    environment:
      MYSQL_ROOT_PASSWORD: change_this_root_password
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: change_this_user_password

    volumes:
      - db_data:/var/lib/mysql:rw

    tmpfs:
      - /tmp:size=64M,noexec,nosuid,nodev

    read_only: false

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5

    stop_grace_period: 30s

    pids_limit: 200

    mem_limit: 1g

    cpus: 1.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - nextcloud-net

  app:
    image: nextcloud:29.0.2-fpm-alpine
    container_name: nextcloud-app

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    user: "33:33"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - CHOWN
      - SETGID
      - SETUID

    ports:
      - "8080:80"

    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: change_this_user_password

    volumes:
      - nextcloud_data:/var/www/html:rw

    tmpfs:
      - /tmp:size=64M,noexec,nosuid,nodev

    read_only: false

    pids_limit: 200

    mem_limit: 2g

    cpus: 2.0

    stop_grace_period: 30s

    healthcheck:
      test: ["CMD-SHELL", "php -f /var/www/html/status.php || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - nextcloud-net

volumes:
  db_data:
  nextcloud_data:

networks:
  nextcloud-net:
    driver: bridge
    internal: true
