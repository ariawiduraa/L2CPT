<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}L2CPT Framework{% endblock %}</title>
    <meta name="description" content="L2CPT - Automated Penetration Testing & Security Assessment Framework">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="navbar-brand">
                <div class="logo-icon">
                    <i class="fas fa-shield-halved"></i>
                </div>
                <span>L2CPT</span>
                <span class="version">v2.0</span>
            </a>
            <div class="navbar-status">
                <span class="pulse-dot"></span>
                <span>System Online</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>L2CPT Automated Assessment Framework &copy; 2026 &mdash; Kali Linux</p>
    </footer>

    {% block scripts %}{% endblock %}

</body>
</html>
